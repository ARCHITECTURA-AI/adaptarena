# AdaptArena v2 analysis plan. Its SHA-256 (analysis_plan.sha256) is committed to git before the locked
# test suite is generated or opened. Deviations are dated entries in plan_amendments.jsonl, never edits here.
version: 1
project: AdaptArena v2
environment: AdaptArena-Survival-v1

research_question: >
  Does training where the policy fails most (planner-regret-guided scenario sampling) produce agents that
  survive unseen shifts better than uniform randomization, at equal transition budget? This is a hypothesis.
  If it loses, the report says so and the negative result stays in.

frozen_components:   # SHA-256 of the simulator, difficulty constants, planner and scripted baselines at lock time
  src/adaptarena/core/params.py: b4545de81d233ec64827eb54caf1d49d7a0e0411a6886f99d6ccfd664078bc53
  src/adaptarena/core/distributions.py: 679914a6fcc38300e5456f96c319179efdf06ea2f78f4789f8702d986f00e864
  src/adaptarena/core/baselines.py: deb17f890c51a595e5caec108db7fa4d4febc0c4a9eba7db1f529bf11b09c3b2
  src/adaptarena/core/env.py: 30283e68d602207bae57ab537fcd0bd78f7b127cd7d0badd5d6b9156340188fd
  src/adaptarena/core/scenario.py: f1cf96885a3c76fffbdb7884ab9a5c2943eee1d51cb61682a5d527aab416dbaa
  src/adaptarena/core/planner.py: cc9f0356120be6802843350c236749657ce0d78b13aba05af6e3ad6ac3d1caaf
frozen_scripts_version: scripts-v1

arms:
  A: {name: Specialist, scenarios: one fixed layout (id 0), temperate weather, sampling: fixed}
  B: {name: Uniform randomization, scenarios: bounded training distribution, sampling: uniform}
  C: {name: Replay by value loss, scenarios: same distribution as B, sampling: prioritized by positive value loss (PLR)}
  D: {name: Replay by planner regret, scenarios: same distribution as B, sampling: prioritized by planner regret (PLR)}
  shared_buffer_code: [C, D]
  buffer: {capacity: 4096, replay_probability: 0.5, prioritization: rank, temperature: 0.3, staleness: 0.3, min_fill: 256}
  transition_budget_steps: 2000000        # identical for every arm, counted across all environments
  training_seeds_per_arm: 10
  checkpoint_rule: highest mean validation survival; earlier checkpoint wins ties
  tuning: one sweep (3 learning rates x 3 entropy coefficients x 3 seeds) per learned method on validation only, same size for every method; none after

evaluation:
  locked_test_suite: {conditions: [familiar, unseen_layout, scarce_food, scarce_water, higher_move_cost, cold_snap, combined_shift], scenarios_per_condition: 50}
  inside_training_distribution: [familiar, unseen_layout]
  mode_primary: deterministic action selection
  mode_secondary: sampled actions (reported separately, never mixed in one aggregate)
  scenario_certification: every scenario must be certified solvable by the reference planner
  validation_suite_used_for: checkpoint selection, tuning, ablations

primary_metric: >
  ladder-normalised survival per scenario = (policy survival - random mean) / (planner survival - random mean);
  random mean over recorded action seeds 0..9; scenarios with zero denominator are excluded and counted.
  Survival means steps survived within the 500-step horizon (right-censored), never expected lifespan.

statistics:
  unit_of_analysis: training seed within a condition (episodes averaged first)
  aggregate: interquartile mean (IQM)
  confidence_intervals: stratified bootstrap by condition, 10000 resamples, 95%
  also_reported: [optimality gap against the planner, probability of improvement, performance profiles, per-seed and per-condition tables]
  seeds_fixed_before_results: true       # no seed is added, dropped or rerun after test results are seen
  matched_scenarios: true

primary_comparisons:      # the only two pre-declared comparisons; everything else is exploratory and listed in the appendix table
  - {id: D_vs_B, test: IQM difference across all seven conditions, supported_if: interval of the difference excludes zero and is positive}
  - {id: D_vs_C, test: IQM difference across all seven conditions, supported_if: interval of the difference excludes zero and is positive}
claim_status_rule: >
  supported = pre-declared comparison whose interval excludes no-difference in the claimed direction.
  mixed = point estimate in the claimed direction but interval includes no-difference, or primary and probability-of-improvement disagree.
  not supported = point estimate against the claim or none.

outcomes_decided_in_advance:
  D_beats_B_and_C: Planner regret helps in this environment, with the stated limits.
  D_ties_C: Planner access adds nothing over value loss here.
  D_loses_to_B: Uniform randomization wins here, with a diagnosis of why regret misled.
  saturation: A condition on which every arm reaches the horizon in more than 90% of episodes is flagged saturated and is not counted as a win.

stress_curves:
  levels: 10
  stressors: [water sites remaining (with respawn), movement-cost multiplier, food scarcity (with respawn)]
  breaking_point: lowest level where mean survival is below 0.5 x familiar-condition survival
  saturation_threshold: 0.9
  unsolvable: levels/scenarios with no planner certificate are drawn as unsolvable and never counted against a policy

parity_gate:
  implementations: [own PPO feedforward, Stable-Baselines3 PPO]
  same: [hyperparameters, environment, reward scaling, transition budget, seeds count]
  seeds: 10
  transition_budget_steps: 1000000
  evaluated_on: a validation suite with fresh scenarios (not used for checkpoint selection)
  ci_level: 0.95
  passes_if: >
    each implementation's IQM survival lies inside the other's bootstrap interval AND the mean learning curves
    lie inside each other's min-max seed band at no less than curve_overlap_min_fraction of evaluation points.
  curve_overlap_min_fraction: 0.8
  blocks: the headline run does not start until the gate passes

ablations:
  default_configuration: arm B, sparse reward, gamma 0.99, 9x9 vision, previous action and energy-cost stat included, bootstrap on truncation
  variants: {discount: [0.9, 0.99, 0.999], vision: [9, 5, 3], previous_action: [included, removed], energy_cost_stat: [included, removed], reward: [sparse, naive shaping, potential-based shaping], truncation: [bootstrap, time-out as death]}
  seeds: 5
  scored_on: validation suite only
  label: exploratory

memory_track:
  policies: [own PPO + LSTM (rung 7), small SSM (rung 8, stretch)]
  seeds: target 10, minimum 5
  predictions_locked_before_first_memory_run: true
  scoring: >
    hit = criterion met; partial = right direction but interval includes zero (or lead shrinks by 20-50% where 'loses most' was predicted);
    miss = wrong direction, or separation where none was predicted.
  predictions:
    - {shift: familiar and unseen layouts, predicted: recurrent ahead, criterion: IQM difference interval above zero on familiar and unseen_layout}
    - {shift: resource relocation, predicted: recurrent loses most of its lead, criterion: relocation lead below 0.5 x unseen-layout lead}
    - {shift: vision reduced to 3x3, predicted: recurrent clearly ahead, criterion: interval above zero and point difference at least 0.10 (models trained on 3x3 vision)}
    - {shift: movement-cost increase with energy-cost stat removed, predicted: recurrent holds survival better, criterion: interval above zero on higher_move_cost (models trained without the stat)}
    - {shift: cold snap, predicted: no separation, criterion: interval includes zero on cold_snap}
  recurrent_state_probe: linear probe for steps since water was last seen and direction to the last seen water; held-out episodes; shuffled-label control
