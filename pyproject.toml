[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptarena"
version = "2.0.0"
description = "AdaptArena v2: an integer-state survival environment with a reference planner, own PPO, and a locked statistical protocol."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
# Core: environment, planner, baselines. NumPy only (Gymnasium wrapper is optional at import).
dependencies = ["numpy>=1.26", "gymnasium>=0.29"]

[project.optional-dependencies]
lab = [
  "torch>=2.2",
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "matplotlib>=3.8",
  "stable-baselines3>=2.3",
]
dev = ["pytest>=8"]

[project.scripts]
adaptarena = "adaptarena.lab.cli:main"

[project.entry-points."gymnasium.envs"]
adaptarena = "adaptarena.gym_env:register_envs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: slower statistical / training tests"]
