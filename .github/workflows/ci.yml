name: ci
on: [push, pull_request]
jobs:
  core:
    name: core tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: python -m pip install -e ".[dev]"
      # state-hash tests: the golden hash must be identical on Linux, macOS and Windows
      - run: python -m pytest tests/test_core.py -m "not slow"
  smoke:
    name: smoke tier (lab)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[lab,dev]"
      - run: python -m pytest -m "not slow"
      - run: adaptarena check-env
      - run: make reproduce TIER=smoke WORKERS=2 || true  # site/report stages need Chromium; see site job
      - run: adaptarena parity --tier smoke --workers 2
  site:
    name: static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci || npm install
        working-directory: site
      - run: npm run build
        working-directory: site
