name: pages
# Publishes site/published (the prebuilt static site) to GitHub Pages.
# The site depends on trained checkpoints that CI cannot regenerate, so it is built locally with
# `make publish` (adaptarena site --tier full) and committed; this workflow only deploys it.
on:
  push:
    branches: [main]
    paths: ["site/published/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/published
      - id: deployment
        uses: actions/deploy-pages@v4
